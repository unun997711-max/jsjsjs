          const part = (geo, mat, x, y, z, p) => { const o = mesh(geo, mat, x, y, z, p, false); o.receiveShadow = false; return o; };
          const cyl = (a, b, len, seg = 20) => { const g = new THREE.CylinderGeometry(a, b, len, seg); g.rotateX(Math.PI / 2); return g; };
          const ring = (r, tube, mat, x, y, z, p) => part(new THREE.TorusGeometry(r, tube, 8, 28), mat, x, y, z, p);
          const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);

          // armored glove + forearm
          function hand(g, x, y, z, left) {
            const h = new THREE.Group(); h.position.set(x, y, z); g.add(h);
            part(bevelBox(0.078, 0.05, 0.1, 0.014), M.rubber, 0, 0, 0, h);
            for (let i = 0; i < 4; i++) {
              const f = part(bevelBox(0.017, 0.022, 0.06, 0.006), M.rubber, -0.028 + i * 0.019, 0, -0.065, h);
              f.rotation.x = 0.35;
            }
            const th = part(bevelBox(0.02, 0.022, 0.07, 0.007), M.rubber, left ? 0.05 : -0.05, 0.012, -0.03, h);
            th.rotation.y = left ? -0.5 : 0.5;
            part(bevelBox(0.074, 0.014, 0.06, 0.005), M.armor, 0, 0.03, -0.01, h);
            part(box(0.05, 0.004, 0.004), neon(0x00ffff, 3), 0, 0.039, -0.01, h);
            const fa = part(cyl(0.036, 0.046, 0.36, 16), M.armor, 0, -0.02, 0.26, h);
            fa.rotation.x = 0.35;
            const rg = ring(0.048, 0.005, neon(0x00ffff, 3.5), 0, -0.012, 0.13, h);
