            part(bevelBox(0.05, 0.13, 0.065, 0.014), M.rubber, 0, -0.115, 0.14, g).rotation.x = -0.28;
            part(bevelBox(0.06, 0.1, 0.22, 0.02), M.dark, 0, -0.01, 0.27, g);
            part(bevelBox(0.066, 0.115, 0.03, 0.01), M.rubber, 0, -0.01, 0.39, g);
