            kick *= Math.exp(-14 * dt);
            let px = BASE.x - sprintB * 0.07 + swayX + bobX * 0.8, py = BASE.y - sprintB * 0.05 + swayY + bobY * 0.8, pz = BASE.z + kick * 0.12;
            let rx = kick * 0.22, ry = sprintB * 0.55, rz = -sprintB * 0.25 + swayX * 2;
            if (rl >= 0) { const e = Math.sin(rl * Math.PI); py -= e * 0.16; rx -= e * 0.5; rz += e * 0.55; px -= e * 0.04; }
            if (swapT >= 0) { const e = Math.sin(swapT / 0.44 * Math.PI); py -= e * 0.4; rx -= e * 0.6; }
            rig.root.position.set(px, py, pz);
            rig.root.rotation.set(rx, ry, rz);
            wo.update(t, dt, {ammo: st.mag / w.mag, since: sinceShot, reload: rl, sprint: sprintB});
            hud();
          }
          EOF_PLAYER
      - name: Write enemies.js
        run: |
          cat > game/www/js/enemies.js <<'EOF_ENEMIES'
          import {THREE, V3, R, scene, M, neon, bevelBox, mesh, glowSprite, rnd, clamp} from './core.js';
          import {pushOut, colliders} from './world.js';
          import {player, targets, damagePlayer, heal, addShield, addAmmo} from './player.js';
          
          // ---------- public API ----------
          export const enemies = [];
          export const eHooks = {};
          ['onSpawn', 'onEnemyHit', 'onKill', 'onEnemyShot', 'onBoltHit', 'onWave', 'onWaveClear', 'onDrop']
            .forEach(n => eHooks[n] = () => {});
          // state: idle | intermission | active
          export const waves = {n: 0, state: 'idle', timer: 0, queue: [], spawnT: 0, kills: 0};
          export const aliveCount = () => enemies.reduce((a, e) => a + (e.alive || e.spawning ? 1 : 0), 0);
          export const remaining = () => waves.queue.length + aliveCount();
          
          // ---------- enemy types ----------
          const TYPES = {
            grunt:  {hp: 60,  speed: 4.2, r: 0.6,  h: 1.95, score: 100, dmg: 10, rate: 1.5, want: 14, color: 0xff00ff, body: 0x5a1050, muz: [0.38, 1.25, 0.65], scale: 1,    bolts: 1, bspeed: 24},
            runner: {hp: 35,  speed: 8.6, r: 0.5,  h: 1.5,  score: 80,  dmg: 14, rate: 0.9, melee: true,   color: 0xff2a5f, body: 0x6a1030, scale: 1},
            drone:  {hp: 40,  speed: 5.6, r: 0.55, h: 1.0,  score: 120, dmg: 8,  rate: 1.1, want: 12, color: 0x00ffff, body: 0x143a5a, fly: true, muz: [0, 0.5, 0.45], scale: 1, bolts: 1, bspeed: 30},
            brute:  {hp: 420, speed: 2.5, r: 1.1,  h: 3.4,  score: 500, dmg: 16, rate: 2.3, want: 16, color: 0xff8800, body: 0x6a3a10, muz: [0.38, 1.25, 0.65], scale: 1.75, bolts: 3, bspeed: 20}
          };
          const UP = new V3(0, 1, 0);
          
          // ---------- cached geometry ----------
          const gc = {};
          const BB = (w, h, d, r = 0.04) => gc['b' + [w, h, d, r]] || (gc['b' + [w, h, d, r]] = bevelBox(w, h, d, r));
          const BX = (w, h, d) => gc['x' + [w, h, d]] || (gc['x' + [w, h, d]] = new THREE.BoxGeometry(w, h, d));
          const SPH = r => gc['s' + r] || (gc['s' + r] = new THREE.SphereGeometry(r, 16, 12));
          const TOR = (r, t) => gc['t' + [r, t]] || (gc['t' + [r, t]] = new THREE.TorusGeometry(r, t, 8, 32));
          const CON = new THREE.ConeGeometry(0.06, 0.4, 8);
          const PADG = new THREE.RingGeometry(0.5, 0.62, 40);
          const P = (g, m, x, y, z, par, sh = false) => mesh(g, m, x, y, z, par, sh);
          
          // ---------- models ----------
          function makeMats(T) {
            const body = M.armor.clone();
            body.color.setHex(T.body); body.emissive.setHex(0xffffff); body.emissiveIntensity = 0;
            return {body, glow: neon(T.color, 3)};
          }
          
