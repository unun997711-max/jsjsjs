            tilt += ((-mx * 0.025 + (dashT > 0 ? -0.05 : 0)) - tilt) * (1 - Math.exp(-8 * dt));

            // camera
            const sh = shake * shake, rn = () => Math.random() - 0.5;
            player.head.set(player.pos.x, player.pos.y + 1.7 - landDip, player.pos.z);
            camera.position.set(
              player.pos.x + bobX * 0.4 + rn() * sh * 0.08,
              player.pos.y + 1.7 + bobY * 0.6 - landDip + rn() * sh * 0.08,
              player.pos.z);
            camera.rotation.set(player.pitch + recoilP + rn() * sh * 0.03, player.yaw + recoilY + rn() * sh * 0.03, tilt + rn() * sh * 0.02);
            shake = Math.max(0, shake - dt * 3.2);
            recoilP *= Math.exp(-10 * dt); recoilY *= Math.exp(-10 * dt);

            // fov + bloom kick
            const ft = 75 + (player.sprint ? 5 : 0) + dashGlow * 16;
            fov += (ft - fov) * (1 - Math.exp(-10 * dt));
            if (Math.abs(camera.fov - fov) > 0.02) { camera.fov = fov; camera.updateProjectionMatrix(); }
            dashGlow = Math.max(0, dashGlow - dt * 4);
            bloom.strength = 1.1 + dashGlow;
            fxU.hurt.value = hurtFx;

            // weapon swap
            if (input.swap) {
              input.swap = false;
              if (swapT < 0) { swapT = 0; swapTo = (cur + 1) % WEAPONS.length; reloadT = -1; hooks.onSwap(WEAPONS[swapTo]); }
            }
            if (swapT >= 0) {
              swapT += dt;
              if (swapT >= 0.22 && cur !== swapTo) {
                rig.list[cur].group.visible = false; cur = swapTo; player.weapon = cur; rig.list[cur].group.visible = true;
              }
              if (swapT >= 0.44) swapT = -1;
            }
            const w = WEAPONS[cur], st = ammo[cur], wo = rig.list[cur];

            // reload
            if (input.reload) { input.reload = false; startReload(); }
            if (reloadT >= 0) {
              reloadT += dt;
              if (reloadT >= w.reload) {
                const take = Math.min(w.mag - st.mag, st.res);
                st.mag += take; st.res -= take; reloadT = -1; hooks.onReloadDone(w);
              }
            }

            // fire
            if (input.fire && !fireHeld) queued = 0.25;
            const trigger = w.auto ? input.fire : queued > 0;
            if (trigger && cd <= 0 && swapT < 0 && reloadT < 0) {
              if (st.mag > 0) shoot();
              else if (st.res > 0) startReload();
              else if (!fireHeld) { hooks.onEmpty(); queued = 0; }
            }
            fireHeld = input.fire;

            // shield regen
            if (sinceHurt > 4 && player.shield < player.maxShield) player.shield = Math.min(player.maxShield, player.shield + 16 * dt);

            // view-model pose
            const rl = reloadT >= 0 ? reloadT / w.reload : -1;
