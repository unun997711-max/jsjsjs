            mesh(new THREE.CylinderGeometry(1.1, 1.4, 5.5, 24, 1, true), M.glass, 0, 4.2, 0, g, false);
            const core = mesh(new THREE.IcosahedronGeometry(.95, 2), neon(0x00ffff, 4), 0, 4.4, 0, g, false);
            const rings = [0, 1, 2].map(i => {
              const r = mesh(new THREE.TorusGeometry(1.9 + i * .55, .07, 10, 60), neon(i == 1 ? 0xff00ff : 0x00ffff, 3), 0, 4.4, 0, g, false);
              r.rotation.set(i * 1.05, i * .6, 0); return r;
            });
            beam = mesh(new THREE.CylinderGeometry(.28, .28, 40, 16, 1, true), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide}), 0, 22, 0, g, false);
            const sp = glowSprite(0x00ffff, 12); sp.position.y = 4.4; g.add(sp);
            reactorLight = new THREE.PointLight(0x00ffff, 300, 36, 2); reactorLight.position.set(0, 5, 0); scene.add(reactorLight);
            addCollider(0, 0, 4.3);
            anim.push((t, dt) => {
              rings.forEach((r, i) => { r.rotation.x += dt * (.8 + i * .5); r.rotation.y += dt * (1.1 - i * .3); });
              core.scale.setScalar(1 + Math.sin(t * 3) * .08); core.rotation.y += dt;
              reactorLight.intensity = 280 + Math.sin(t * 3) * 60; beam.material.opacity = .18 + Math.sin(t * 5) * .05;
            });
          }

          function buildCity() {
            const wt = windowsTex();
            const wm = new THREE.MeshStandardMaterial({color: 0x08080f, emissive: 0xffffff, emissiveMap: wt, emissiveIntensity: 1.6, metalness: .5, roughness: .6, fog: false});
            const bg = new THREE.BoxGeometry(1, 1, 1);
            const im = new THREE.InstancedMesh(bg, wm, 110), m4 = new THREE.Matrix4();
            for (let i = 0; i < 110; i++) {
              const a = Math.random() * Math.PI * 2, d = rnd(75, 190), h = rnd(25, 120), w = rnd(8, 22);
              m4.compose(new V3(Math.cos(a) * d, h / 2 - 4, Math.sin(a) * d), new THREE.Quaternion().setFromAxisAngle(new V3(0, 1, 0), a), new V3(w, h, w));
              im.setMatrixAt(i, m4);
            }
            scene.add(im);
          }

          function buildEmbers() {
            const n = 700, p = new Float32Array(n * 3); emberVel = new Float32Array(n);
            for (let i = 0; i < n; i++) { p.set([rnd(-R, R), rnd(0, 20), rnd(-R, R)], i * 3); emberVel[i] = rnd(.3, 1.4); }
            const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
            embers = new THREE.Points(g, new THREE.PointsMaterial({size: .13, color: 0x66ddff, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false}));
            embers.frustumCulled = false; scene.add(embers);
          }

          export function buildWorld() {
            scene.add(new THREE.AmbientLight(0x4a4a85, 1.0));
            scene.add(new THREE.HemisphereLight(0x6688ff, 0x330044, .7));
            sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
            const sc = sun.shadow.camera; sc.left = sc.bottom = -26; sc.right = sc.top = 26; sc.near = 1; sc.far = 90;
            sun.shadow.bias = -0.0004; scene.add(sun); scene.add(sun.target);
            [[0x00ffff, -20, -16], [0xff00ff, 20, -16], [0xff00ff, -20, 16], [0x00ffff, 20, 16]].forEach(([c, x, z]) => {
              const l = new THREE.PointLight(c, 220, 38, 2); l.position.set(x, 6, z); scene.add(l); pointLights.push(l);
            });
            buildSky(); buildFloor(); buildWalls(); buildTurbines(); buildPillars(); buildCover(); buildReactor(); buildCity(); buildEmbers();
          }

          export function updateWorld(t, dt, px, pz) {
            sun.position.set(px + 14, 34, pz + 10); sun.target.position.set(px, 0, pz);
            pointLights.forEach((l, i) => l.intensity = 220 + 70 * Math.sin(t * 2 + i * 1.7));
            anim.forEach(f => f(t, dt));
            skyMat.uniforms.t.value = t;
            const p = embers.geometry.attributes.position.array;
            for (let i = 0; i < emberVel.length; i++) {
              p[i * 3 + 1] += emberVel[i] * dt; p[i * 3] += Math.sin(t + i) * dt * .3;
              if (p[i * 3 + 1] > 22) p[i * 3 + 1] = 0;
            }
            embers.geometry.attributes.position.needsUpdate = true;
          }

          // circle collision against every static collider
          export function pushOut(p, r) {
            for (const k of colliders) {
              const dx = p.x - k.x, dz = p.z - k.z, d = Math.hypot(dx, dz), m = k.r + r;
              if (d < m && d > 0.001) { p.x = k.x + dx / d * m; p.z = k.z + dz / d * m; }
            }
            p.x = Math.max(-R + 1.5, Math.min(R - 1.5, p.x));
            p.z = Math.max(-R + 1.5, Math.min(R - 1.5, p.z));
          }
