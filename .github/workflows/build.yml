            const cf = part(cyl(0.05, 0.05, 0.05, 16), M.dark, 0, -0.03, 0.17, h);
            cf.rotation.x = 0.35;
            return h;
          }

          // common weapon rig: muzzle point, flash sprite, flash cone, dynamic light
          function rig(mz, def) {
            const g = new THREE.Group();
            const muzzle = new THREE.Object3D(); muzzle.position.set(mz[0], mz[1], mz[2]); g.add(muzzle);
            const flash = glowSprite(def.color, 0.55); flash.material.opacity = 0; muzzle.add(flash);
            const cg = new THREE.ConeGeometry(0.035, 0.28, 10); cg.rotateX(-Math.PI / 2);
            const cone = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({
              color: def.color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false
            }));
