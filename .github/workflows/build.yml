          export function buildWeapons(parent) {
            const root = new THREE.Group(); root.scale.setScalar(0.85); parent.add(root);
            const list = [buildRifle(WEAPONS[0]), buildScatter(WEAPONS[1]), buildRail(WEAPONS[2])];
            list.forEach((w, i) => { w.group.visible = i === 0; root.add(w.group); });
            return {root, list};
          }
          EOF_WEAPONS

      - name: Write player.js
        run: |
          cat > game/www/js/player.js <<'EOF_PLAYER'
          import {THREE, V3, R, camera, $, clamp, fxU, bloom} from './core.js';
          import {pushOut, colliders} from './world.js';
          import {WEAPONS, buildWeapons} from './weapons.js';

          // ---------- public API ----------
          // input: set by touch controls (Part 5). moveY: forward +1, moveX: right +1. jump/reload/swap/dash are one-shot flags.
          export const input = {moveX: 0, moveY: 0, fire: false, jump: false, reload: false, swap: false, dash: false};
          export const settings = {sens: 0.0042, assist: 0.35};
          export const hooks = {};
          ['onShot', 'onTracer', 'onImpact', 'onHit', 'onHurt', 'onDeath', 'onStep', 'onJump', 'onLand', 'onDash', 'onReload', 'onReloadDone', 'onSwap', 'onEmpty', 'onPickup']
            .forEach(n => hooks[n] = () => {});
          // enemies register here: {alive, pos: V3 (feet), r: body radius, h: height, hit(dmg, point, dir, head) -> true if killed}
          export const targets = [];
          export const player = {
            pos: new V3(0, 0, 12), vel: new V3(), head: new V3(0, 1.7, 12), yaw: 0, pitch: 0,
            hp: 100, maxHp: 100, shield: 100, maxShield: 100, onGround: true, dead: false, sprint: false, speed: 0, weapon: 0
          };
          export const ammo = WEAPONS.map(w => ({mag: w.mag, res: w.reserve}));

          // ---------- internal state ----------
          const BASE = {x: 0.17, y: -0.19, z: -0.3};
          const SPAWN = new V3(0, 0, 12);
          const _o = new V3(), _d = new V3(), _r = new V3(), _u = new V3(), _b = new V3(), _mz = new V3(), _p = new V3(), _n = new V3(), _q = new V3(), _e = new V3(), _wn = new V3();
          let rig = null, cur = 0, E = null, hudKey = '';
          let cd = 0, reloadT = -1, swapT = -1, swapTo = 0, sinceShot = 9, sinceHurt = 9, queued = 0, fireHeld = false;
          let bobPh = 0, bobY = 0, bobX = 0, lastStep = 0, landDip = 0, tilt = 0, shake = 0, recoilP = 0, recoilY = 0;
          let kick = 0, swayX = 0, swayY = 0, sprintB = 0, dashT = 0, dashCd = 0, dashDX = 0, dashDZ = -1, dashGlow = 0;
          let hurtFx = 0, hmT = 0, deadT = 0, invuln = 0, fov = 75, lookDX = 0, lookDY = 0;

          export function initPlayer() {
            rig = buildWeapons(camera);
            E = {hpb: $('hpb'), shb: $('shb'), ammo: $('ammo'), wpn: $('wpn'), hit: $('hit'), hitm: $('hitm'), dash: $('dash')};
            resetPlayer();
          }

          export function resetPlayer() {
            player.pos.copy(SPAWN); player.vel.set(0, 0, 0); player.yaw = 0; player.pitch = 0;
            player.hp = player.maxHp; player.shield = player.maxShield; player.dead = false; player.onGround = true;
            ammo.forEach((a, i) => { a.mag = WEAPONS[i].mag; a.res = WEAPONS[i].reserve; });
            cur = 0; player.weapon = 0; cd = 0; reloadT = -1; swapT = -1; sinceShot = 9; sinceHurt = 9;
            recoilP = recoilY = shake = kick = hurtFx = deadT = dashT = dashCd = 0; invuln = 1.5;
            camera.rotation.set(0, 0, 0);
            if (rig) rig.list.forEach((w, i) => w.group.visible = i === 0);
            hudKey = '';
          }

          export function look(dx, dy) { lookDX += dx; lookDY += dy; }
          export function addShake(a) { shake = Math.min(1, shake + a); }
          export function dashReady() { return dashCd <= 0; }

          // ---------- damage / pickups ----------
          export function damagePlayer(amount, src) {
            if (player.dead || invuln > 0) return false;
            sinceHurt = 0; hurtFx = Math.min(1, hurtFx + 0.35 + amount / 60); shake = Math.min(1, shake + 0.4);
            let a = amount;
            if (player.shield > 0) { const s = Math.min(player.shield, a); player.shield -= s; a -= s; }
            player.hp = Math.max(0, player.hp - a);
            hooks.onHurt(amount, src || null);
            if (player.hp <= 0) { player.dead = true; deadT = 0; hooks.onDeath(); }
            return true;
          }
          export function heal(n) {
            if (player.dead || player.hp >= player.maxHp) return false;
            player.hp = Math.min(player.maxHp, player.hp + n); hooks.onPickup('hp'); return true;
          }
          export function addShield(n) {
            if (player.dead || player.shield >= player.maxShield) return false;
            player.shield = Math.min(player.maxShield, player.shield + n); hooks.onPickup('shield'); return true;
          }
          export function addAmmo() {
            let used = false;
            ammo.forEach((a, i) => {
              const w = WEAPONS[i], cap = Math.round(w.reserve * 1.5);
              if (a.res < cap) { a.res = Math.min(cap, a.res + w.pickup); used = true; }
            });
            if (used) hooks.onPickup('ammo');
            return used;
          }

          // ---------- ray helpers ----------
          function rayCircle(ox, oz, dx, dz, cx, cz, r) {
            const fx = ox - cx, fz = oz - cz, a = dx * dx + dz * dz;
            if (a < 1e-8) return null;
            const b = 2 * (fx * dx + fz * dz), c = fx * fx + fz * fz - r * r, disc = b * b - 4 * a * c;
            if (disc < 0) return null;
            const sq = Math.sqrt(disc);
            let s = (-b - sq) / (2 * a);
            if (s < 0) s = (-b + sq) / (2 * a);
            return s;
          }

          // nearest static hit: floor, arena wall or cover/pillar
          function worldHit(o, d, maxT) {
            let t = maxT, kind = 'none';
            if (d.y < -1e-5) { const s = -o.y / d.y; if (s > 0 && s < t) { t = s; kind = 'floor'; _wn.set(0, 1, 0); } }
            const lim = R - 0.75;
            if (Math.abs(d.x) > 1e-5) {
              const s = ((d.x > 0 ? lim : -lim) - o.x) / d.x;
              if (s > 0 && s < t) { t = s; kind = 'wall'; _wn.set(d.x > 0 ? -1 : 1, 0, 0); }
            }
            if (Math.abs(d.z) > 1e-5) {
              const s = ((d.z > 0 ? lim : -lim) - o.z) / d.z;
              if (s > 0 && s < t) { t = s; kind = 'wall'; _wn.set(0, 0, d.z > 0 ? -1 : 1); }
            }
            for (const k of colliders) {
              const s = rayCircle(o.x, o.z, d.x, d.z, k.x, k.z, k.r);
              if (s === null || s <= 0 || s >= t) continue;
              const y = o.y + d.y * s, h = k.r > 4 ? 6 : k.r > 2 ? 14 : k.r < 1.2 ? 1.6 : 2.4;
              if (y > 0 && y < h) { t = s; kind = 'cover'; _wn.set(o.x + d.x * s - k.x, 0, o.z + d.z * s - k.z).normalize(); }
            }
            return {t, kind, normal: _wn};
          }

          // gentle aim assist for touch screens
          function assistDir(o, d) {
            let best = null, bs = 0.07;
            for (const tg of targets) {
              if (!tg.alive) continue;
              _p.set(tg.pos.x, tg.pos.y + tg.h * 0.55, tg.pos.z).sub(o);
              const dist = _p.length();
              if (dist > 70 || dist < 1) continue;
              _p.divideScalar(dist);
              const ang = Math.acos(clamp(_p.dot(d), -1, 1));
              if (ang < bs) { bs = ang; best = _n.copy(_p); }
            }
            if (best) d.lerp(best, settings.assist).normalize();
          }

          function markHit(head, killed) {
            hmT = 0.18;
            E.hitm.style.borderColor = killed ? '#ff2a5f' : head ? '#ffd24a' : '#fff';
          }

          // one hitscan pellet
          function pellet(w, o, d) {
            const wl = worldHit(o, d, w.range);
            const found = [];
            for (const tg of targets) {
              if (!tg.alive) continue;
              const s = rayCircle(o.x, o.z, d.x, d.z, tg.pos.x, tg.pos.z, tg.r);
              if (s === null || s < 0 || s > wl.t) continue;
              const y = o.y + d.y * s;
              if (y < tg.pos.y - 0.05 || y > tg.pos.y + tg.h + 0.05) continue;
              found.push({tg, s, head: y > tg.pos.y + tg.h * 0.78});
            }
            found.sort((a, b) => a.s - b.s);
            const n = w.pierce ? found.length : Math.min(1, found.length);
            let endT = wl.t, hit = false;
            for (let i = 0; i < n; i++) {
              const f = found[i];
              _q.copy(d).multiplyScalar(f.s).add(o);
              let dmg = w.dmg * (f.head ? 2 : 1);
              if (w.falloff) dmg *= 1 - clamp((f.s - 8) / 30, 0, 0.65);
              const killed = f.tg.hit(dmg, _q.clone(), d.clone(), f.head);
              hooks.onHit(f.tg, _q.clone(), dmg, f.head, !!killed);
              markHit(f.head, killed);
              hit = true;
              if (!w.pierce) endT = f.s;
            }
            _e.copy(d).multiplyScalar(endT).add(o);
            if ((w.pierce || !hit) && wl.kind !== 'none') hooks.onImpact(_e.clone(), wl.kind, wl.normal.clone());
            hooks.onTracer(w, _mz.clone(), _e.clone(), hit);
          }

          function shoot() {
            const w = WEAPONS[cur], st = ammo[cur], wo = rig.list[cur];
            st.mag--; cd = w.rate; sinceShot = 0; queued = 0;
            camera.updateMatrixWorld(true);
            camera.getWorldPosition(_o); camera.getWorldDirection(_d);
            camera.matrixWorld.extractBasis(_r, _u, _b);
            assistDir(_o, _d);
            wo.muzzle.getWorldPosition(_mz);
            hooks.onShot(w, _mz.clone(), cur);
            const base = _d.clone();
            for (let k = 0; k < w.pellets; k++) {
              const a = Math.random() * 6.2832, rr = Math.sqrt(Math.random()) * w.spread;
              const dir = base.clone().addScaledVector(_r, Math.cos(a) * rr).addScaledVector(_u, Math.sin(a) * rr).normalize();
              pellet(w, _o, dir);
            }
            recoilP += w.recoil; recoilY += (Math.random() - 0.5) * w.recoil * 0.8;
            shake = Math.min(1, shake + w.shake); kick = Math.min(1.2, kick + w.kick);
            player.pitch = Math.min(1.45, player.pitch + w.recoil * 0.35);
            wo.fire();
          }

          function startReload() {
            const w = WEAPONS[cur], st = ammo[cur];
            if (swapT >= 0 || reloadT >= 0 || st.mag >= w.mag || st.res <= 0) return;
            reloadT = 0; hooks.onReload(w);
          }

          // ---------- HUD ----------
          function hud() {
            const w = WEAPONS[cur], st = ammo[cur];
            const hp = Math.ceil(player.hp), sh = Math.ceil(player.shield), rl = reloadT >= 0;
            const key = hp + '|' + sh + '|' + cur + '|' + st.mag + '|' + st.res + '|' + rl;
            if (key !== hudKey) {
              hudKey = key;
              E.hpb.style.width = (hp / player.maxHp * 100) + '%';
              E.shb.style.width = (sh / player.maxShield * 100) + '%';
              E.ammo.innerHTML = rl ? 'RELOAD' : st.mag + '<span style="font-size:15px;color:#0ffa"> / ' + st.res + '</span>';
              E.wpn.textContent = w.name;
              E.wpn.style.color = '#' + w.color.toString(16).padStart(6, '0');
            }
            E.hit.style.opacity = Math.min(1, hurtFx * 1.2);
            E.hitm.style.opacity = hmT / 0.18;
            E.dash.style.opacity = dashCd > 0 ? 0.35 : 1;
          }

          // ---------- main update ----------
          export function updatePlayer(t, dt) {
            if (!rig) return;
            dt = Math.min(dt, 0.05);
            sinceShot += dt; sinceHurt += dt; queued -= dt;
            hurtFx = Math.max(0, hurtFx - dt * 1.6); hmT = Math.max(0, hmT - dt);
            invuln = Math.max(0, invuln - dt); dashCd = Math.max(0, dashCd - dt); cd = Math.max(0, cd - dt);

            // death camera
            if (player.dead) {
              deadT += dt;
              const k = 1 - Math.exp(-4 * dt);
              camera.position.y += (0.35 - camera.position.y) * k;
              camera.rotation.z += (0.9 - camera.rotation.z) * k;
              camera.rotation.x += (-0.3 - camera.rotation.x) * k;
              fxU.hurt.value = 0.6;
              rig.list[cur].update(t, dt, {ammo: 0, since: 9, reload: -1, sprint: 0});
              hud(); lookDX = lookDY = 0;
              return;
            }

            // look + weapon sway
            player.yaw -= lookDX * settings.sens;
            player.pitch = clamp(player.pitch - lookDY * settings.sens, -1.45, 1.45);
            swayX = clamp(swayX - lookDX * 0.0006, -0.05, 0.05);
            swayY = clamp(swayY + lookDY * 0.0005, -0.04, 0.04);
            lookDX = lookDY = 0;
            swayX *= Math.exp(-7 * dt); swayY *= Math.exp(-7 * dt);

            // movement
            const sn = Math.sin(player.yaw), cs = Math.cos(player.yaw);
            let mx = input.moveX, my = input.moveY;
            const len = Math.hypot(mx, my);
            if (len > 1) { mx /= len; my /= len; }
            const mag = Math.min(1, len);
            const wishX = -sn * my + cs * mx, wishZ = -cs * my - sn * mx;
            player.sprint = mag > 0.93 && my > 0.6 && !input.fire && player.onGround;
            const top = player.sprint ? 9.4 : 6.4;
            const v = player.vel;

            if (input.dash) {
              input.dash = false;
              if (dashCd <= 0) {
                dashT = 0.2; dashCd = 1.5; invuln = Math.max(invuln, 0.25); dashGlow = 1;
                let dx = wishX, dz = wishZ;
                if (len < 0.1) { dx = -sn; dz = -cs; }
                const l = Math.hypot(dx, dz) || 1;
                dashDX = dx / l; dashDZ = dz / l;
