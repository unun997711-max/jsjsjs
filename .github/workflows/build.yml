            [[-15, -13], [15, -13], [-15, 13], [15, 13], [0, -27], [0, 27], [-29, 0], [29, 0]].forEach(([x, z], k) => {
              const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
              mesh(lathe(prof, 28), M.metal, 0, 0, 0, g);
              [1.6, 4.2, 7, 10, 12.7].forEach((y, i) => {
                const t = mesh(new THREE.TorusGeometry(1.55 + (i == 4 ? .35 : 0), .09, 10, 40), neon((i + k) % 2 ? 0xff00ff : 0x00ffff, 3), 0, y, 0, g, false);
                t.rotation.x = Math.PI / 2;
              });
              for (let a = 0; a < 4; a++) {
                const s = mesh(new THREE.BoxGeometry(.14, 6.5, .1), neon(0x00ffff, 3), Math.cos(a * Math.PI / 2) * 1.42, 7.5, Math.sin(a * Math.PI / 2) * 1.42, g, false);
                s.rotation.y = -a * Math.PI / 2;
              }
              const sp = glowSprite(k % 2 ? 0xff00ff : 0x00ffff, 9); sp.position.y = 12.7; g.add(sp);
