          import {THREE, M, neon, bevelBox, mesh, lathe, glowSprite} from './core.js';

          // ---------- weapon stats ----------
          export const WEAPONS = [
            {name: 'PULSE RIFLE', mag: 30, reserve: 240, rate: 0.085, dmg: 14, pellets: 1, spread: 0.010, reload: 1.55, auto: true,
