name: Build Neon Arena APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project
        run: |
          mkdir -p game && cd game
          npm init -y
          npm i three@0.160.0 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www/lib www/js
          cp node_modules/three/build/three.module.js www/lib/
          cp -r node_modules/three/examples/jsm www/lib/jsm

      - name: Write index.html
        run: |
          cat > game/www/index.html <<'EOF_HTML'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>Neon Arena</title>
          <style>
          *{box-sizing:border-box}
          html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif;color:#0ff}
          canvas{display:block}
          #hud{position:fixed;inset:0;pointer-events:none}
          .st{position:absolute;font-weight:700;text-shadow:0 0 8px #0ff;font-size:15px}
          .bar{height:11px;border:1px solid #0ff8;background:#0008;width:190px}
          .bar>div{height:100%;width:100%}
          #hp{left:14px;top:14px}
          #hpb{background:#ff2a5f;box-shadow:0 0 10px #ff2a5f}
          #sh{left:14px;top:32px}
          #shb{background:#0ff;box-shadow:0 0 10px #0ff}
          #sc{right:14px;top:12px;font-size:18px}
          #wv{left:0;right:0;top:40px;text-align:center;font-size:24px;color:#f0f;text-shadow:0 0 14px #f0f}
          #ammo{right:14px;top:40px;font-size:26px;color:#fff}
          #wpn{right:14px;top:72px;color:#f0f;font-size:13px}
          #kf{left:14px;top:60px;font-size:12px;line-height:1.5;color:#fff}
          #radar{position:absolute;left:50%;top:8px;margin-left:-190px;width:90px;height:90px;border-radius:50%;border:1px solid #0ff8;background:#0006;box-shadow:0 0 12px #0ff4}
          #cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px}
          #cross:before,#cross:after{content:"";position:absolute;background:#f0f;box-shadow:0 0 6px #f0f}
          #cross:before{left:10px;top:0;width:2px;height:22px}
          #cross:after{top:10px;left:0;height:2px;width:22px}
          #hitm{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border:2px solid #fff;transform:rotate(45deg);opacity:0}
          #hit{position:absolute;inset:0;background:radial-gradient(transparent 45%,#f03);opacity:0}
          #stick{position:absolute;left:4vw;bottom:8vh;width:130px;height:130px;border-radius:50%;border:2px solid #0ff8;background:#0ff1;pointer-events:auto;box-shadow:0 0 18px #0ff4}
          #knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#0ffa;box-shadow:0 0 14px #0ff}
          .btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #f0f;background:#f0f2;color:#f0f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 0 16px #f0f6}
          .btn.c{border-color:#0ff;color:#0ff;background:#0ff2;box-shadow:0 0 16px #0ff6}
          #fire{right:4vw;bottom:10vh;width:100px;height:100px;font-size:16px}
          #jump{right:calc(4vw + 112px);bottom:5vh;width:66px;height:66px}
          #rld{right:calc(4vw + 112px);bottom:calc(5vh + 78px);width:60px;height:60px}
          #swp{right:4vw;bottom:calc(10vh + 112px);width:60px;height:60px}
          #dash{right:calc(4vw + 112px);bottom:calc(5vh + 148px);width:60px;height:60px}
          #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#102,#000e);text-align:center;font-size:17px;padding:20px}
          #msg h1{font-size:40px;text-shadow:0 0 18px #0ff,0 0 40px #f0f;margin:0 0 8px;letter-spacing:6px}
          #msg button{margin-top:16px;padding:12px 40px;font-size:20px;color:#0ff;background:none;border:2px solid #0ff;border-radius:8px;box-shadow:0 0 14px #0ff}
          </style>
          </head>
          <body>
          <div id="hud">
            <div class="st bar" id="hp"><div id="hpb"></div></div>
            <div class="st bar" id="sh"><div id="shb"></div></div>
            <div class="st" id="sc">SCORE 0</div>
            <div class="st" id="wv"></div>
            <div class="st" id="ammo">30</div>
            <div class="st" id="wpn">PULSE RIFLE</div>
            <div class="st" id="kf"></div>
            <canvas id="radar" width="180" height="180"></canvas>
            <div id="cross"></div><div id="hitm"></div><div id="hit"></div>
            <div id="stick"><div id="knob"></div></div>
            <div class="btn" id="fire">FIRE</div>
            <div class="btn c" id="jump">JUMP</div>
            <div class="btn c" id="rld">RELOAD</div>
            <div class="btn" id="swp">SWAP</div>
            <div class="btn c" id="dash">DASH</div>
          </div>
          <div id="msg"><h1>NEON ARENA</h1><div id="mt">Loading...</div><button id="go">START</button></div>
          <script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/jsm/"}}</script>
          <script>window.onerror=function(m,s,l){var e=document.getElementById('mt');if(e)e.textContent='Error: '+m+' ('+(s||'').split('/').pop()+':'+l+')';};</script>
          <script type="module" src="./js/main.js"></script>
          </body>
          </html>
          EOF_HTML

      - name: Write core.js
        run: |
          cat > game/www/js/core.js <<'EOF_CORE'
          import * as THREE from 'three';
          import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
          import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
          import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
          import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
          import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
          import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
          export {THREE};
          export const R = 44;
          export const V3 = THREE.Vector3;
          export const $ = id => document.getElementById(id);
          export const rnd = (a, b) => a + Math.random() * (b - a);
          export const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

          // ---------- renderer ----------
          export const renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: 'high-performance'});
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          renderer.setSize(innerWidth, innerHeight);
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.2;
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          document.body.prepend(renderer.domElement);

          export const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x02010a);
          scene.fog = new THREE.FogExp2(0x07051a, 0.021);
          export const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.08, 700);
          camera.rotation.order = 'YXZ';
          scene.add(camera);

          const pm = new THREE.PMREMGenerator(renderer);
          scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;

          // ---------- post processing ----------
          const FX = {
            uniforms: {tDiffuse: {value: null}, t: {value: 0}, hurt: {value: 0}},
            vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
            fragmentShader: 'uniform sampler2D tDiffuse;uniform float t,hurt;varying vec2 vUv;' +
              'float r(vec2 s){return fract(sin(dot(s,vec2(12.9898,78.233)))*43758.5453);}' +
              'void main(){vec2 c=vUv-.5;float d=dot(c,c);vec2 o=c*d*.05*(1.+hurt*4.);' +
              'vec3 col=vec3(texture2D(tDiffuse,vUv-o).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv+o).b);' +
              'col*=1.-d*1.4;col+=(r(vUv*(fract(t)+1.))-.5)*.035;col.r+=hurt*d*3.;' +
              'gl_FragColor=vec4(col,1.);}'
          };
          const composer = new EffectComposer(renderer);
          composer.addPass(new RenderPass(scene, camera));
          export const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.6, 0.18);
          composer.addPass(bloom);
          const fxPass = new ShaderPass(FX);
          composer.addPass(fxPass);
          composer.addPass(new OutputPass());
          export const fxU = fxPass.uniforms;
          export function render(t) {
            fxU.t.value = t;
            composer.render();
          }
          addEventListener('resize', () => {
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
          });

          // ---------- procedural textures ----------
          function speckle(x, s, n, a) {
            for (let i = 0; i < n; i++) {
              const v = Math.random() * 255 | 0;
              x.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + a + ')';
              x.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
            }
          }
          // mode 0 = albedo, 1 = bump, 2 = emissive
          function panels(x, s, mode) {
            const n = 2, p = s / n;
            x.fillStyle = mode == 2 ? '#000' : mode == 1 ? '#999' : '#2a2e3a';
            x.fillRect(0, 0, s, s);
            if (mode < 2) speckle(x, s, s * 8, 0.07);
            for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
              const px = i * p, py = j * p;
              if (mode == 0) {
                const g = x.createLinearGradient(px, py, px + p, py + p);
                g.addColorStop(0, '#343a4a'); g.addColorStop(1, '#1a1d27');
                x.fillStyle = g; x.fillRect(px + 5, py + 5, p - 10, p - 10);
              }
              x.lineWidth = mode == 2 ? 4 : 7;
              x.strokeStyle = mode == 0 ? '#07080d' : mode == 1 ? '#000' : '#00d8ff';
              if (mode != 2 || (i + j) % 2 == 0) x.strokeRect(px + 3, py + 3, p - 6, p - 6);
              if (mode < 2) {
                x.fillStyle = mode == 0 ? '#5b6275' : '#fff';
                [[14, 14], [p - 14, 14], [14, p - 14], [p - 14, p - 14]].forEach(([a, b]) => {
                  x.beginPath(); x.arc(px + a, py + b, 4, 0, 7); x.fill();
                });
              }
              if (mode == 2 && (i * 2 + j) % 3 == 1) {
                x.fillStyle = '#ff00c8'; x.fillRect(px + p * .3, py + p * .5 - 3, p * .4, 6);
              }
            }
          }
          const panelCv = [0, 1, 2].map(m => {
            const c = document.createElement('canvas'); c.width = c.height = 512;
            panels(c.getContext('2d'), 512, m); return c;
          });
          export function panelTex(mode, rx, ry) {
            const t = new THREE.CanvasTexture(panelCv[mode]);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(rx, ry); t.anisotropy = 8;
            if (mode != 1) t.colorSpace = THREE.SRGBColorSpace;
            return t;
          }
          export function hazardTex() {
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const x = c.getContext('2d');
            x.fillStyle = '#15151a'; x.fillRect(0, 0, 128, 128);
            x.fillStyle = '#e8b400';
            for (let i = -128; i < 256; i += 32) {
              x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 16, 0); x.lineTo(i + 16 + 128, 128); x.lineTo(i + 128, 128); x.fill();
            }
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
          }
          export function windowsTex() {
            const c = document.createElement('canvas'); c.width = 128; c.height = 256;
            const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, 128, 256);
            const cols = ['#00e5ff', '#ff00c8', '#ffd24a', '#7a5cff'];
            for (let i = 0; i < 16; i++) for (let j = 0; j < 40; j++) {
              if (Math.random() < 0.35) { x.fillStyle = cols[Math.random() * 4 | 0]; x.fillRect(i * 8 + 1, j * 6.4 + 1, 5, 3.5); }
            }
            const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
          }

          // ---------- materials ----------
          export const neon = (c, i = 3) => new THREE.MeshStandardMaterial({color: 0x000000, emissive: c, emissiveIntensity: i, toneMapped: false});
          export const M = {
            metal: new THREE.MeshStandardMaterial({color: 0x454c60, metalness: 0.9, roughness: 0.32, envMapIntensity: 0.9}),
            dark: new THREE.MeshStandardMaterial({color: 0x1b1e28, metalness: 0.8, roughness: 0.4, envMapIntensity: 0.7}),
            armor: new THREE.MeshStandardMaterial({color: 0x6a1030, metalness: 0.85, roughness: 0.28, envMapIntensity: 1}),
            chrome: new THREE.MeshStandardMaterial({color: 0xcfd6e6, metalness: 1, roughness: 0.15, envMapIntensity: 1.2}),
            glass: new THREE.MeshStandardMaterial({color: 0x66ccff, metalness: 0.2, roughness: 0.05, transparent: true, opacity: 0.28}),
            rubber: new THREE.MeshStandardMaterial({color: 0x0c0c10, metalness: 0.1, roughness: 0.9}),
            floor: new THREE.MeshStandardMaterial({
              color: 0xffffff, map: panelTex(0, R / 4, R / 4), bumpMap: panelTex(1, R / 4, R / 4), bumpScale: 3,
              emissiveMap: panelTex(2, R / 4, R / 4), emissive: 0xffffff, emissiveIntensity: 1.1,
              metalness: 0.85, roughness: 0.28, envMapIntensity: 0.6
            }),
            wall(rx, ry) {
              return new THREE.MeshStandardMaterial({
                color: 0xffffff, map: panelTex(0, rx, ry), bumpMap: panelTex(1, rx, ry), bumpScale: 3,
                emissiveMap: panelTex(2, rx, ry), emissive: 0xffffff, emissiveIntensity: 0.9,
                metalness: 0.8, roughness: 0.4, envMapIntensity: 0.6
              });
            }
          };

          // ---------- geometry helpers ----------
          export function bevelBox(w, h, d, r = 0.05, seg = 3) {
            const s = new THREE.Shape(), a = w / 2 - r, b = h / 2 - r;
            s.moveTo(-a, -b); s.lineTo(a, -b); s.lineTo(a, b); s.lineTo(-a, b); s.closePath();
            const g = new THREE.ExtrudeGeometry(s, {depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: seg, curveSegments: 1});
            g.center(); return g;
          }
          export function lathe(pts, seg = 32) {
            return new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg);
          }
          export function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true;
            if (parent) parent.add(m);
            return m;
          }
          let _gs;
          export function glowSprite(color, size) {
            if (!_gs) {
              const c = document.createElement('canvas'); c.width = c.height = 128;
              const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
              g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.4)'); g.addColorStop(1, 'rgba(255,255,255,0)');
              x.fillStyle = g; x.fillRect(0, 0, 128, 128);
              _gs = new THREE.CanvasTexture(c);
            }
            const s = new THREE.Sprite(new THREE.SpriteMaterial({map: _gs, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true}));
            s.scale.set(size, size, 1); return s;
          }
          EOF_CORE

      - name: Write world.js
        run: |
          cat > game/www/js/world.js <<'EOF_WORLD'
          import {THREE, R, V3, scene, M, neon, bevelBox, lathe, mesh, glowSprite, hazardTex, windowsTex, rnd, panelTex} from './core.js';

          export const colliders = [];   // circles {x, z, r}
          export const pointLights = []; // pulsing arena lights
          export const sun = new THREE.DirectionalLight(0x6f7dff, 1.3);
          const anim = [];
          let skyMat, embers, emberVel, reactorLight, beam;

          function addCollider(x, z, r) { colliders.push({x, z, r}); }

          function buildSky() {
            skyMat = new THREE.ShaderMaterial({
              side: THREE.BackSide, depthWrite: false, fog: false,
              uniforms: {t: {value: 0}},
              vertexShader: 'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
              fragmentShader:
                'varying vec3 vP;uniform float t;' +
                'float h(vec3 p){p=fract(p*.3183+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}' +
                'float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);' +
                'return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),' +
                'mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}' +
                'void main(){vec3 d=normalize(vP);float y=d.y*.5+.5;vec3 c=mix(vec3(.02,0.,.06),vec3(0.,.03,.12),y);' +
                'float f=n(d*3.+t*.01)*.6+n(d*7.)*.3+n(d*15.)*.1;' +
                'c+=vec3(.55,0.,.8)*pow(f,3.)*smoothstep(0.,.6,y);c+=vec3(0.,.4,.7)*pow(n(d*4.+9.),4.)*.8;' +
                'c+=vec3(1.,.2,.7)*smoothstep(.25,0.,abs(d.y-.02))*.18;' +
                'c+=step(.985,h(floor(d*190.)))*vec3(.8,.9,1.);gl_FragColor=vec4(c,1.);}'
            });
            scene.add(new THREE.Mesh(new THREE.SphereGeometry(450, 32, 24), skyMat));
          }

          function buildFloor() {
            const f = mesh(new THREE.PlaneGeometry(R * 2, R * 2), M.floor, 0, 0, 0, scene, false);
            f.rotation.x = -Math.PI / 2;
            // glowing emblem rings in the centre of the arena
            [[6, 6.25, 0x00ffff], [9.5, 9.7, 0xff00ff], [16, 16.15, 0x00ffff], [26, 26.2, 0xff00ff]].forEach(([a, b, c]) => {
              const r = mesh(new THREE.RingGeometry(a, b, 96), neon(c, 2.2), 0, 0.02, 0, scene, false);
              r.rotation.x = -Math.PI / 2;
            });
            for (let i = 0; i < 12; i++) {
              const a = i / 12 * Math.PI * 2;
              const l = mesh(new THREE.PlaneGeometry(0.18, 8), neon(i % 2 ? 0xff00ff : 0x00ffff, 1.8), Math.cos(a) * 12.5, 0.03, Math.sin(a) * 12.5, scene, false);
              l.rotation.x = -Math.PI / 2; l.rotation.z = -a + Math.PI / 2;
            }
          }

          function buildWalls() {
            const H = 16;
            [[0, -R, R * 2, 1.5, 0], [0, R, R * 2, 1.5, Math.PI], [-R, 0, R * 2, 1.5, Math.PI / 2], [R, 0, R * 2, 1.5, -Math.PI / 2]].forEach(([x, z, w, d, ry]) => {
              const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
              mesh(new THREE.BoxGeometry(w, H, d), M.wall(w / 6, H / 6), 0, H / 2, 0, g);
              // trim + glowing strips
              [0.35, 6, 12, 15.6].forEach((y, i) => mesh(new THREE.BoxGeometry(w, 0.22, d + 0.25), neon(i % 2 ? 0xff00ff : 0x00ffff, 2.6), 0, y, 0, g, false));
              // buttresses with neon slits and glass lamps
              for (let i = -w / 2 + 6; i < w / 2; i += 11) {
                mesh(bevelBox(2.4, H - 1, 1.2, 0.18), M.metal, i, H / 2, d / 2 + 0.3, g);
                mesh(new THREE.BoxGeometry(0.2, H - 4, 0.12), neon(0x00ffff, 3.2), i, H / 2, d / 2 + 0.95, g, false);
                const s = glowSprite(0x00ffff, 5); s.position.set(i, H - 3, d / 2 + 1.4); g.add(s);
              }
              // glowing windows between buttresses
              for (let i = -w / 2 + 11.5; i < w / 2 - 5; i += 11) {
                mesh(bevelBox(5, 2.2, 0.3, 0.08), M.glass, i, 9, d / 2 + 0.05, g, false);
                mesh(new THREE.BoxGeometry(4.6, 0.12, 0.1), neon(0xff00ff, 2.8), i, 7.9, d / 2 + 0.12, g, false);
              }
            });
            // wall to the wall collision is handled by the player clamp (R-1)
          }

          function buildTurbines() {
            const bs = new THREE.Shape();
            bs.moveTo(0, 0); bs.quadraticCurveTo(0.9, 1.2, 0.35, 3.2); bs.lineTo(-0.35, 3.2); bs.quadraticCurveTo(-0.9, 1.2, 0, 0);
            const bg = new THREE.ExtrudeGeometry(bs, {depth: 0.06, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 2});
            [[0, -R + 1, 0], [0, R - 1, Math.PI], [-R + 1, 0, Math.PI / 2], [R - 1, 0, -Math.PI / 2]].forEach(([x, z, ry]) => {
              const g = new THREE.Group(); g.position.set(x, 9, z); g.rotation.y = ry; scene.add(g);
              mesh(lathe([[0, 0], [3.7, 0], [3.9, .15], [3.9, .6], [3.6, .7], [0, .7]], 40), M.dark, 0, 0, -0.35, g).rotation.x = Math.PI / 2;
              mesh(new THREE.TorusGeometry(3.6, 0.12, 12, 48), neon(0xff00ff, 2.5), 0, 0, 0.2, g, false);
              const rot = new THREE.Group(); g.add(rot);
              for (let i = 0; i < 8; i++) {
                const b = mesh(bg, M.chrome, 0, 0, 0, rot); b.rotation.z = i / 8 * Math.PI * 2; b.scale.setScalar(0.95);
              }
              mesh(new THREE.SphereGeometry(0.55, 24, 16), neon(0x00ffff, 3), 0, 0, 0.1, rot, false);
