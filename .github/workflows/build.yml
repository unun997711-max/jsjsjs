              }
            }
            if (dashT > 0) {
              dashT -= dt; v.x = dashDX * 26; v.z = dashDZ * 26;
            } else {
              const k = 1 - Math.exp(-(player.onGround ? 13 : 3.2) * dt);
              v.x += (wishX * top * mag - v.x) * k;
              v.z += (wishZ * top * mag - v.z) * k;
            }
            if (input.jump) {
              input.jump = false;
              if (player.onGround) { v.y = 8.4; player.onGround = false; hooks.onJump(); }
            }
            if (!player.onGround) v.y -= 24 * dt;
            player.pos.x += v.x * dt; player.pos.z += v.z * dt;
            pushOut(player.pos, 0.55);
            if (!player.onGround) {
              player.pos.y += v.y * dt;
              if (player.pos.y <= 0) {
                if (v.y < -5) { landDip = clamp(-v.y * 0.007, 0, 0.14); hooks.onLand(-v.y); }
                player.pos.y = 0; v.y = 0; player.onGround = true;
              }
            }
            player.speed = Math.hypot(v.x, v.z);

            // head bob + footsteps
            const moving = player.onGround && player.speed > 1;
            const bk = moving ? Math.min(1, player.speed / 8) : 0;
            if (moving) bobPh += dt * player.speed * (player.sprint ? 1.25 : 1.4);
            const kb = 1 - Math.exp(-14 * dt);
            bobY += (Math.sin(bobPh * 2) * 0.035 * bk - bobY) * kb;
            bobX += (Math.cos(bobPh) * 0.025 * bk - bobX) * kb;
            const sc = Math.floor(bobPh / Math.PI);
            if (sc !== lastStep) { lastStep = sc; if (moving) hooks.onStep(player.sprint); }
