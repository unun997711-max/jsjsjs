              const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rnd(0, 3); scene.add(g);
              mesh(bevelBox(2.2, 2.2, 2.2, .14), M.metal, 0, 1.1, 0, g);
              mesh(bevelBox(2.3, .35, 2.3, .08), hm, 0, .2, 0, g);
              mesh(bevelBox(2.3, .35, 2.3, .08), hm, 0, 2.0, 0, g);
