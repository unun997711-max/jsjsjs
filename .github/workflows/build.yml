             recoil: 0.055, shake: 0.28, kick: 0.2, range: 60, color: 0xff00ff, light: 90, pickup: 16, pierce: false, falloff: true},
            {name: 'RAILGUN', mag: 4, reserve: 24, rate: 1.15, dmg: 130, pellets: 1, spread: 0, reload: 2.3, auto: false,
             recoil: 0.07, shake: 0.4, kick: 0.26, range: 400, color: 0x8a6bff, light: 140, pickup: 6, pierce: true, falloff: false}
          ];

