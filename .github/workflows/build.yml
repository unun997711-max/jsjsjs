            });
            // long barriers with neon tops
            [[-10, -6, .4], [11, 8, -.5], [-3, 24, 0], [3, -24, 0], [-27, 8, 1.57], [27, -8, 1.57]].forEach(([x, z, ry], i) => {
              const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
